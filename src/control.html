<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Tree Picker</title>
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <div id="stp-root" class="stp">
      <div class="stp-header">
        <div id="stp-field" class="stp-field">
          <span id="stp-lock" class="stp-lock" aria-hidden="true" hidden><svg viewBox="0 0 16 16" width="12" height="12" focusable="false"><path fill="currentColor" d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 1 0-4 0v2z" /></svg></span>
          <input id="stp-input" class="stp-input" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false" />
          <span id="stp-required" class="stp-required" role="img" aria-label="Required" title="Required" hidden>!</span>
          <span id="stp-chevron" class="stp-chevron" aria-hidden="true"></span>
        </div>
        <button id="stp-clear" class="stp-button" type="button" title="Clear the value" hidden>&#10005;</button>
      </div>
      <div id="stp-panel" class="stp-panel" hidden>
        <div id="stp-tree" class="stp-tree"></div>
      </div>
      <p id="stp-message" class="stp-message" hidden></p>
    </div>
    <script src="control.js"></script>
  </body>
</html>
