<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Tree Picker</title>
    <link rel="stylesheet" href="control.css" />
    <style>
      /* The dialog CLAIMS its size rather than adopting one. With height:100%
         the content had no intrinsic height, so it simply filled whatever the
         host handed out — which was a tree three rows tall. Giving the tree a
         real height makes the content tall, and dialog.js then asks the host to
         match it. Whichever mechanism the host actually honours, the dialog
         comes out roomy. */
      body { padding: 8px; box-sizing: border-box; }
      .stp-tree { flex: 1 1 auto; height: 360px; max-height: none; }
    </style>
  </head>
  <body>
    <div id="stp-root" class="stp">
      <input id="stp-filter" class="stp-filter" type="search" placeholder="Filter&#8230;" autocomplete="off" spellcheck="false" />
      <div id="stp-tree" class="stp-tree"></div>
      <p id="stp-message" class="stp-message" hidden></p>
    </div>
    <script src="dialog.js"></script>
  </body>
</html>
